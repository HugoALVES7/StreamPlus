<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- 800 CSS px wide whatever the window size: keeps the embed above its 400x300 minimum. -->
<meta name="viewport" content="width=800, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p { position: fixed; inset: 0; }
  #p iframe { border: 0; }
</style>
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
</head>
<body>
<div id="p"></div>
<script>
  const q = new URLSearchParams(location.search);
  let player, vol = parseFloat(q.get('vol') || '0.5'), muted = q.get('muted') === '1';
  function init() {
    if (!window.Twitch) return setTimeout(init, 300);
    const o = { width: '100%', height: '100%', parent: [location.hostname], autoplay: true, muted };
    if (q.get('video')) { o.video = q.get('video'); if (q.get('time')) o.time = toTime(+q.get('time')); }
    else o.channel = q.get('channel');
    player = new Twitch.Player('p', o);
    player.addEventListener(Twitch.Player.READY, () => { apply(); setTimeout(kick, 1500); setTimeout(kick, 5000); });
    player.addEventListener(Twitch.Player.PLAYING, () => { started = true; apply(); applyQ(); });
    // The embed waits for a click before playing with sound: a real tap in its centre.
    const kick = () => { if (!started && !paused && window.Native) Native.tap(); };
    setTimeout(kick, 15000);
  }
  let started = false, paused = false;
  function toTime(s) { s = Math.max(0, s | 0); return Math.floor(s / 3600) + 'h' + Math.floor(s % 3600 / 60) + 'm' + (s % 60) + 's'; }
  function apply() { if (!player) return; player.setVolume(vol); player.setMuted(muted); }
  // Quality: the best one at or below the cap (720 = "Auto, 720p max" by default; 1080 to force 1080p).
  let cap = parseInt(q.get('q') || '720', 10), lastQ = null, lastQt = 0;
  function applyQ() {
    try {
      const qs = (player && player.getQualities()) || []; if (!qs.length) return;
      const ok = qs.filter(x => x.group !== 'auto').map(x => ({ x, h: parseInt(x.name, 10) || 0 })).filter(o => o.h && o.h <= cap).sort((a, b) => b.h - a.h)[0];
      const target = ok ? (ok.x.group || ok.x.name) : 'auto';
      if (player.getQuality() === target || (lastQ === target && Date.now() - lastQt < 4000)) return;
      lastQ = target; lastQt = Date.now(); player.setQuality(target);
    } catch (e) { }
  }
  setInterval(applyQ, 2000);
  window.pip = {
    audio(v, m) { vol = v; muted = m; apply(); },
    quality(h) { cap = h; lastQ = null; applyQ(); },
    pause(p) { paused = p; try { if (!player) return; if (p) player.pause(); else player.play(); } catch (e) { } },
    time() { try { return player ? player.getCurrentTime() : 0; } catch (e) { return 0; } }
  };
  init();
  setInterval(() => { try { if (player && window.Native) Native.time(player.getCurrentTime()); } catch (e) { } }, 5000);
</script>
</body>
</html>
